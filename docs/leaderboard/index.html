<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drift tasks leaderboard</title>
<!-- Generated by scripts/envs_leaderboard.py from data/envs_hard/; do not edit the copy in docs/. -->
<style>
:root {
  color-scheme: light;
  --page: #f9f9f9; --surface: #ffffff; --ink: #191919; --ink-2: #666666;
  --grid: #e7e7e7; --axis: #c2c2c2; --ring: rgba(11,11,11,0.10);
  --s1: #257de0; --s2: #f47230; --s3: #00b894;
  --base: #666666; --bar: #191919;
  --good: #0aac23; --warn: #fbb315; --crit: #dc3c3d;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0b0b0b; --surface: #191919; --ink: #efefef; --ink-2: #9c9c9c;
    --grid: #303030; --axis: #474747; --ring: rgba(255,255,255,0.10);
    --s1: #338ced; --s2: #e76624; --s3: #00a888; --base: #9c9c9c; --bar: #efefef;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0b0b0b; --surface: #191919; --ink: #efefef; --ink-2: #9c9c9c;
  --grid: #303030; --axis: #474747; --ring: rgba(255,255,255,0.10);
  --s1: #338ced; --s2: #e76624; --s3: #00a888; --base: #9c9c9c; --bar: #efefef;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
h1 { font-size: 24px; margin: 0 0 4px; }
h2 { font-size: 18px; margin: 0; }
p.sub { color: var(--ink-2); margin: 0 0 20px; max-width: 70ch; }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px;
  padding: 16px; margin: 0 0 16px; }
.head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; margin-bottom: 8px; }
.pill { font-size: 13px; color: var(--ink-2); }
.pill b { color: var(--ink); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink-2);
  margin: 0 0 16px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
svg { display: block; width: 100%; height: auto; overflow: visible; }
svg text { fill: var(--ink-2); font-size: 12px; font-variant-numeric: tabular-nums; }
svg text.name { fill: var(--ink); font-size: 13px; }
.hit { fill: transparent; cursor: default; }
.hit:focus { outline: none; }
.row:hover .mark, .row:focus-within .mark { stroke: var(--ink); stroke-width: 2; }
#tip { position: fixed; pointer-events: none; background: var(--surface); color: var(--ink);
  border: 1px solid var(--ring); border-radius: 8px; padding: 8px 10px; font-size: 13px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.12); display: none; max-width: 280px; }
#tip strong { display: block; font-size: 15px; }
details { margin-top: 8px; }
summary { cursor: pointer; color: var(--ink-2); font-size: 13px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; margin-top: 8px;
  font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--grid); }
th { color: var(--ink-2); font-weight: 600; }
.gates { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.gate { font-size: 12px; padding: 2px 6px; border-radius: 6px; border: 1px solid var(--ring);
  color: var(--ink); }
.gate i { font-style: normal; margin-right: 3px; }
.gate.pass i { color: var(--good); } .gate.fail i { color: var(--crit); }
.gate.flag i, .gate.pending i { color: var(--ink-2); }
.wrap { overflow-x: auto; }
</style>
</head>
<body>
<main>
  <h1>Drift tasks leaderboard</h1>
  <p class="sub" id="intro"></p>
  <div class="legend" id="legend"></div>
  <div id="tasks"></div>
  <p class="sub" id="foot"></p>
</main>
<div id="tip" role="tooltip"></div>
<script>
const DATA = {
 "threshold": 0.75,
 "config": "envs-v1-2026-11-26",
 "built": "2026-11-26",
 "tasks": [
  {
   "task": "pulse_wrong_model",
   "status": "included",
   "close_call": false,
   "models": {
    "claude-opus-5-5": {
     "pass_rate": 0.625,
     "score": 0.7867,
     "rollouts": 3,
     "interval": [
      0.5813,
      0.6667
     ]
    },
    "claude-sonnet-5-5": {
     "pass_rate": 0.6458,
     "score": 0.8149,
     "rollouts": 3,
     "interval": [
      0.6,
      0.6917
     ]
    }
   },
   "baselines": {
    "trivial": {
     "pass_rate": 0.5,
     "score": 0.5
    },
    "reference": {
     "pass_rate": 0.6125,
     "score": 0.62330636516212
    },
    "genie_drive12": {
     "pass_rate": 0.93125,
     "score": 0.9263798942980946
    }
   },
   "verdict": "open",
   "gates": {
    "A1": "pass",
    "A2": "pass",
    "A3": "pass",
    "A4": "pass",
    "A5": "pass",
    "A6": "pending",
    "A7": "pass",
    "A8": "pass",
    "A9": "pass",
    "A10": "pass",
    "A11": "pass",
    "A12": "pass",
    "A13": "pass",
    "S1": "pass",
    "H1": "pending",
    "H2": "pending",
    "H3": "pending"
   }
  },
  {
   "task": "readout_drift",
   "status": "included",
   "close_call": false,
   "models": {
    "claude-opus-5-5": {
     "pass_rate": 0.56,
     "score": 0.7423,
     "rollouts": 3,
     "interval": [
      0.48,
      0.6333
     ]
    },
    "claude-sonnet-5-5": {
     "pass_rate": 0.5533,
     "score": 0.7091,
     "rollouts": 3,
     "interval": [
      0.4689,
      0.64
     ]
    }
   },
   "baselines": {
    "trivial": {
     "pass_rate": 0.5,
     "score": 0.5
    },
    "reference": {
     "pass_rate": 0.6466666666666666,
     "score": 0.7417149716560199
    },
    "genie_stretch": {
     "pass_rate": 0.9266666666666666,
     "score": 0.9189828278959353
    }
   },
   "verdict": "open",
   "gates": {
    "A1": "pass",
    "A2": "pass",
    "A3": "pass",
    "A4": "pass",
    "A5": "pass",
    "A6": "pending",
    "A7": "pass",
    "A8": "pass",
    "A9": "pass",
    "A10": "pass",
    "A11": "pass",
    "A12": "pass",
    "A13": "pass",
    "S1": "pass",
    "H1": "pending",
    "H2": "pending",
    "H3": "pending"
   }
  }
 ]
};
const NS = "http://www.w3.org/2000/svg";
const SLOTS = ["var(--s1)", "var(--s2)", "var(--s3)"];
const BASE = { trivial: "floor (trivial)", reference: "reference" };
const pct = v => v == null ? "-" : v.toFixed(2);

function el(tag, attrs, parent, text) {
  const e = tag.startsWith("svg:") ? document.createElementNS(NS, tag.slice(4))
                                   : document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) e.setAttribute(k, v);
  if (text != null) e.textContent = text;
  if (parent) parent.appendChild(e);
  return e;
}

// One color per model, fixed by sorted name across every task (never by rank).
const models = [...new Set(DATA.tasks.flatMap(t => Object.keys(t.models)))].sort();
const color = Object.fromEntries(models.map((m, i) => [m, SLOTS[i] || "var(--base)"]));

document.getElementById("intro").textContent =
  `Each task asks an agent to notice that a qubit's model has changed, say what changed, and ` +
  `fix the calibration. A task counts only if the best agent passes under ` +
  `${Math.round(DATA.threshold * 100)}% of its hard instances (pass rate: right change call, ` +
  `half the diagnosis, half the fix gap). Dots are models (95% interval as whiskers); grey ` +
  `diamonds are baselines.`;
document.getElementById("foot").textContent =
  `Built ${DATA.built} from data/envs_hard/ (${DATA.config}). Hard tier, paper seeds, ` +
  `held-out dev data. Gates: docs/task-standard.md.`;

const legend = document.getElementById("legend");
for (const m of models) {
  const s = el("span", {}, legend);
  const svg = el("svg:svg", { width: 10, height: 10, viewBox: "0 0 10 10" }, s);
  svg.style.width = "10px";
  el("svg:circle", { cx: 5, cy: 5, r: 4.5, fill: color[m] }, svg);
  el("span", {}, s, m);
}
{
  const s = el("span", {}, legend);
  const svg = el("svg:svg", { width: 12, height: 12, viewBox: "0 0 12 12" }, s);
  svg.style.width = "12px";
  el("svg:path", { d: "M6 1 L11 6 L6 11 L1 6 Z", fill: "var(--base)" }, svg);
  el("span", {}, s, "baseline");
}

const tip = document.getElementById("tip");
function show(ev, value, label, extra) {
  tip.replaceChildren();
  el("strong", {}, tip, value);
  el("div", {}, tip, label);
  if (extra) el("div", {}, tip, extra).style.color = "var(--ink-2)";
  tip.style.display = "block";
  const r = ev.target.getBoundingClientRect ? ev.target.getBoundingClientRect() : null;
  const x = ev.clientX ?? (r ? r.right : 0), y = ev.clientY ?? (r ? r.top : 0);
  tip.style.left = Math.min(x + 12, innerWidth - 290) + "px";
  tip.style.top = (y + 12) + "px";
}
const hide = () => { tip.style.display = "none"; };

function chart(card, t) {
  const rows = [];
  for (const [m, r] of Object.entries(t.models).sort((a, b) => b[1].pass_rate - a[1].pass_rate))
    rows.push({ name: m, kind: "model", ...r });
  for (const [k, r] of Object.entries(t.baselines))
    if (r.pass_rate != null) rows.push({ name: BASE[k] || `ceiling (${k})`, kind: "base", ...r });
  const W = Math.max(card.clientWidth - 32, 280), L = Math.min(190, Math.round(W * 0.4));
  const R = 48, H = 26, top = 8, h = top + rows.length * H + 28;
  const svg = el("svg:svg", { viewBox: `0 0 ${W} ${h}`, width: W, height: h, role: "img",
    "aria-label": `${t.task}: pass rate by model and baseline` }, card);
  const x = v => L + v * (W - L - R);
  const step = W < 480 ? 0.5 : 0.25;
  for (let v = 0; v <= 1.0001; v += step) {
    el("svg:line", { x1: x(v), x2: x(v), y1: top, y2: h - 24, stroke: "var(--grid)" }, svg);
    el("svg:text", { x: x(v), y: h - 8, "text-anchor": "middle" }, svg, v.toFixed(2));
  }
  el("svg:line", { x1: x(DATA.threshold), x2: x(DATA.threshold), y1: top - 4, y2: h - 24,
    stroke: "var(--bar)", "stroke-width": 2, "stroke-dasharray": "4 3" }, svg);
  el("svg:text", { x: x(DATA.threshold) + 4, y: top + 4, fill: "var(--ink)" }, svg, "bar");
  rows.forEach((r, i) => {
    const y = top + i * H + H / 2;
    const g = el("svg:g", { class: "row" }, svg);
    el("svg:text", { x: L - 12, y: y + 4, "text-anchor": "end", class: "name" }, g, r.name);
    if (r.kind === "model") {
      if (r.interval) {
        el("svg:line", { x1: x(r.interval[0]), x2: x(r.interval[1]), y1: y, y2: y,
          stroke: color[r.name], "stroke-width": 2, "stroke-linecap": "round" }, g);
      }
      el("svg:circle", { cx: x(r.pass_rate), cy: y, r: 6, fill: color[r.name],
        stroke: "var(--surface)", "stroke-width": 2, class: "mark" }, g);
    } else {
      const c = x(r.pass_rate);
      el("svg:path", { d: `M${c} ${y - 6} L${c + 6} ${y} L${c} ${y + 6} L${c - 6} ${y} Z`,
        fill: "var(--base)", stroke: "var(--surface)", "stroke-width": 2, class: "mark" }, g);
    }
    const value = r.interval ? `${pct(r.pass_rate)} [${pct(r.interval[0])}, ${pct(r.interval[1])}]`
                             : pct(r.pass_rate);
    el("svg:text", { x: W - 4, y: y + 4, "text-anchor": "end", class: "name" }, g,
      pct(r.pass_rate));
    const hit = el("svg:rect", { x: L, y: y - H / 2, width: W - L - R, height: H,
      class: "hit", tabindex: 0 }, g);
    const extra = `native score ${pct(r.score)}` + (r.rollouts ? `, ${r.rollouts} rollouts` : "");
    hit.addEventListener("pointermove", ev => show(ev, `pass ${value}`, r.name, extra));
    hit.addEventListener("focus", ev => show(ev, `pass ${value}`, r.name, extra));
    hit.addEventListener("pointerleave", hide);
    hit.addEventListener("blur", hide);
  });
  return rows;
}

function table(card, rows) {
  const d = el("details", {}, card);
  el("summary", {}, d, "Table view");
  const w = el("div", { class: "wrap" }, d);
  const tb = el("table", {}, w);
  const hr = el("tr", {}, el("thead", {}, tb));
  for (const h of ["", "pass rate", "95% interval", "native score", "rollouts"]) el("th", {}, hr, h);
  const body = el("tbody", {}, tb);
  for (const r of rows) {
    const tr = el("tr", {}, body);
    el("td", {}, tr, r.name);
    el("td", {}, tr, pct(r.pass_rate));
    el("td", {}, tr, r.interval ? `${pct(r.interval[0])} to ${pct(r.interval[1])}` : "-");
    el("td", {}, tr, pct(r.score));
    el("td", {}, tr, r.rollouts ?? "-");
  }
}

const ICON = { pass: "✓", fail: "✗", flag: "!", pending: "…" };
const holder = document.getElementById("tasks");
function render() {
holder.replaceChildren();
for (const t of DATA.tasks) {
  const card = el("section", { class: "card" }, holder);
  const head = el("div", { class: "head" }, card);
  el("h2", {}, head, t.task);
  const st = el("span", { class: "pill" }, head, "selection ");
  el("b", {}, st, t.status + (t.close_call ? " (close call)" : ""));
  if (t.verdict) { const v = el("span", { class: "pill" }, head, "acceptance "); el("b", {}, v, t.verdict); }
  const rows = chart(card, t);
  if (Object.keys(t.gates).length) {
    const g = el("div", { class: "gates", "aria-label": "acceptance gates" }, card);
    for (const [k, s] of Object.entries(t.gates)) {
      const c = el("span", { class: `gate ${s}`, title: `${k}: ${s}` }, g);
      el("i", {}, c, ICON[s] || "?");
      c.appendChild(document.createTextNode(`${k} ${s}`));
    }
  }
  table(card, rows);
}
}
render();
let lastW = innerWidth;
addEventListener("resize", () => {
  if (innerWidth === lastW) return;
  lastW = innerWidth;
  clearTimeout(render.t);
  render.t = setTimeout(render, 120);
});
</script>
</body>
</html>
